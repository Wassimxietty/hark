<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://librivox.org; style-src 'self'; img-src 'self' data: blob: https://archive.org https://*.archive.org; media-src 'self' data: blob: https://archive.org https://*.archive.org; connect-src 'self' https://archive.org https://*.archive.org; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Hark</title>
<meta name="description" content="A light player for free public-domain audiobooks.">
<meta name="theme-color" content="#FBF1DE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hark">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="stylesheet" href="css/app.css">
<script src="js/boot.js"></script>
</head>
<body>
<div id="app">
  <div id="screens"></div>
  <div id="mini" hidden></div>
  <nav id="tabs" aria-label="Main"></nav>
</div>
<div id="player" aria-hidden="true"></div>
<div id="scrim" hidden></div>
<div id="sheet" role="dialog" aria-modal="true" hidden></div>
<div id="toast" role="status" hidden></div>
<input type="file" id="pick" accept="image/*" hidden>
<noscript>Hark needs JavaScript to run.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
